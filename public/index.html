<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ServerDash</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/ds/styles.css">
  <link rel="stylesheet" href="/vendor/uPlot.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="logo" role="img" aria-label="Next Buzz"></span>ServerDash</a>
    <nav>
      <a href="#/">Overzicht</a>
      <a href="#/websites">Websites</a>
      <a href="#/verbruik">Verbruik</a>
      <a href="#/onderhoud">Onderhoud</a>
      <a href="#/beveiliging">Beveiliging</a>
      <a href="#/incidenten">Incidenten <span id="incBadge" class="nav-badge hidden"></span></a>
      <a href="#/beheer" class="admin-only">Beheer</a>
    </nav>
    <div class="top-right">
      <span id="conn" class="conn"></span>
      <a href="#/tv" class="btn ghost small" title="Tv-/wandmodus">TV</a>
      <a href="#/account" class="btn ghost small" id="whoami">Account</a>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Wissel tussen licht en donker thema">
        <svg class="sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#E8A317" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21M5.6 5.6l1 1M17.4 17.4l1 1M18.4 5.6l-1 1M6.6 17.4l-1 1"></path></svg>
        <svg class="moon" width="12" height="12" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
        <span class="knob"></span>
      </button>
      <button id="logout" class="btn ghost small">Uitloggen</button>
    </div>
  </header>
  <main id="main"></main>
  <script src="/vendor/uPlot.iife.min.js"></script>
  <script src="/app.js"></script>
  <script src="/pages.js"></script>
</body>
</html>
